name: Build, Push and Deploy UniAtlas (YÖK Atlas & YKS Analytics)

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build & Push Container Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Custom Registry
        uses: docker/login-action@v3
        with:
          registry: registry.bogazici.app
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Extract Metadata for Image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: registry.bogazici.app/budok/yokatlas-scrape
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Trigger Dokploy Redeployment
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Dokploy Stack Redeployment
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL || 'https://dokploy.bogazici.app' }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_COMPOSE_ID: ${{ secrets.DOKPLOY_COMPOSE_ID || 'XDOIv2PdTkrsjfzu5eSRH' }}
        run: |
          if [ -z "$DOKPLOY_API_KEY" ]; then
            echo "::error::DOKPLOY_API_KEY secret is not configured."
            exit 1
          fi
          echo "Triggering Dokploy redeployment for UniAtlas ($DOKPLOY_COMPOSE_ID)..."

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "$DOKPLOY_URL/api/compose.redeploy" \
            -H "auth-token: $DOKPLOY_API_KEY" \
            -H "x-api-key: $DOKPLOY_API_KEY" \
            -H "Authorization: Bearer $DOKPLOY_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"composeId\": \"$DOKPLOY_COMPOSE_ID\"}")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n 1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "✅ Dokploy redeployment triggered successfully! (HTTP $HTTP_CODE)"
            echo "$BODY"
          else
            echo "Primary endpoint returned HTTP $HTTP_CODE. Trying fallback webhook endpoint..."
            FALLBACK_RESP=$(curl -s -w "\n%{http_code}" -X POST "$DOKPLOY_URL/api/deploy/compose?composeId=$DOKPLOY_COMPOSE_ID" \
              -H "auth-token: $DOKPLOY_API_KEY" \
              -H "x-api-key: $DOKPLOY_API_KEY" \
              -H "Authorization: Bearer $DOKPLOY_API_KEY")

            FALLBACK_CODE=$(echo "$FALLBACK_RESP" | tail -n 1)
            FALLBACK_BODY=$(echo "$FALLBACK_RESP" | sed '$d')

            if [ "$FALLBACK_CODE" -ge 200 ] && [ "$FALLBACK_CODE" -lt 300 ]; then
              echo "✅ Dokploy fallback redeployment triggered successfully! (HTTP $FALLBACK_CODE)"
              echo "$FALLBACK_BODY"
            else
              echo "::error::Dokploy API returned HTTP $HTTP_CODE (Fallback: HTTP $FALLBACK_CODE)."
              echo "Primary Body: $BODY"
              echo "Fallback Body: $FALLBACK_BODY"
              exit 1
            fi
          fi
