version: '3.8'

services:
  app:
    image: ${APP_IMAGE:-registry.bogazici.app/budok/yokatlas-scrape:latest}
    environment:
      PORT: 8000
    networks:
      - frontend_net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8000/api/stats || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.labels.type == tanri
      resources:
        reservations:
          cpus: '0.25'
          memory: 512M
        limits:
          cpus: '1.5'
          memory: 2G
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.yokatlas.rule=Host(`atlas.bogazici.app`)"
        - "traefik.http.routers.yokatlas.entrypoints=websecure"
        - "traefik.http.routers.yokatlas.tls.certresolver=letsencrypt"
        - "traefik.http.services.yokatlas.loadbalancer.server.port=8000"

networks:
  frontend_net:
    external: true
